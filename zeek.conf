# =============================================================
# zeek.conf — ZeekNSM Configuration File
#
# INI-style key = value pairs.
# Lines starting with # or ; are comments.
# Section names are enclosed in [brackets].
# =============================================================

# =============================================================
# [capture]  — Packet acquisition settings
# =============================================================
[capture]

# Local IP address to bind the raw socket to.
# Use "auto" to automatically select the first non-loopback interface.
# Set to a specific IP (e.g. 192.168.1.10) to capture on that interface only.
interface = auto

# Capture in promiscuous mode.
# NOTE: SIO_RCVALL is always required on Windows for raw socket capture;
# this flag is retained for documentation and future PCAP backend support.
promiscuous = yes

# Maximum bytes per packet to capture (snaplen).
# 65535 captures the full packet. Lower values reduce memory usage.
snaplen = 65535

# Kernel receive buffer in bytes (4 MB default).
# Increase if you see high pkts_dropped in stats.log.
buffer_size = 4194304


# =============================================================
# [logging]  — Log file settings
# =============================================================
[logging]

# Directory where log files are written. Created automatically if absent.
log_dir = C:\zeek\logs

# Log rotation interval in seconds.
#   3600  = rotate every hour   (recommended for high-traffic environments)
#   86400 = rotate once per day (default for low-traffic)
#   0     = never rotate by time
rotation_interval = 3600

# Rotate a log file when it exceeds this size (bytes). 0 = no size limit.
# 104857600 = 100 MB
max_file_size = 104857600

# Enable / disable individual log streams.
# Disabling a stream saves I/O without affecting capture or detection.
enable_conn   = yes    # conn.log   — one record per closed flow
enable_dns    = yes    # dns.log    — DNS queries and responses
enable_http   = yes    # http.log   — HTTP request+response pairs
enable_ssl    = yes    # ssl.log    — TLS sessions + JA3/JA3S hashes
enable_notice = yes    # notice.log — detection notices
enable_weird  = yes    # weird.log  — protocol anomalies
enable_stats  = yes    # stats.log  — periodic capture statistics

# How often (seconds) to write a stats.log entry.
stats_interval = 30


# =============================================================
# [detection]  — Behavioral detection thresholds
# =============================================================
[detection]

# Port scan: fire a Scan::Port_Scan notice when a single source IP
# touches this many unique destination ports within port_scan_window seconds.
port_scan_threshold = 15
port_scan_window    = 60

# DNS tunneling: flag queries whose name length exceeds this value (bytes).
# Typical legitimate FQDNs are < 60 characters; tunneling queries are often
# 80-200+ characters.
dns_tunnel_query_len = 100


# =============================================================
# [connection]  — Flow inactivity timeouts
# =============================================================
[connection]

# Seconds of inactivity before a TCP flow is expired and logged.
# Increase for long-lived sessions (e.g. database connections).
tcp_inactivity_timeout = 300

# Seconds of inactivity before a UDP flow is expired.
udp_inactivity_timeout = 60

# Seconds of inactivity before an ICMP flow is expired.
icmp_inactivity_timeout = 30


# =============================================================
# [service]  — Windows service settings
# =============================================================
[service]

# Automatically start when the service is first installed.
# (The service is always configured as SERVICE_AUTO_START; this flag
#  exists as a documentary reminder and for future use.)
auto_start = yes
